name: package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua syntax check and smoke test
        run: |
          sudo apt-get install -y lua5.1 >/dev/null
          for f in $(find LizzaricksUnitFrames -name '*.lua'); do luac5.1 -p -o /dev/null "$f"; done
          lua5.1 tools/smoketest.lua
      - name: Build LizzaricksUnitFrames.zip
        run: sh tools/package.sh
      # A release is only made on request: Actions -> package -> "Run workflow".
      # Pushes to main just check and build. The zip unzips straight into
      # Interface/AddOns with the right folder name.
      - name: Publish release "latest"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/LizzaricksUnitFrames.zip --title "Lizzarick's Unit Frames (latest)" \
            --notes "Newest build of main ($GITHUB_SHA). Unzip LizzaricksUnitFrames.zip into World of Warcraft/_classic_beta_/Interface/AddOns." \
            --target "$GITHUB_SHA" --latest
