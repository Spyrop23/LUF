name: package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lua syntax check and smoke test
        run: |
          sudo apt-get install -y lua5.1 >/dev/null
          for f in $(find LizzaricksUnitFrames -name '*.lua'); do luac5.1 -p -o /dev/null "$f"; done
          lua5.1 tools/smoketest.lua
          LUF_RETAIL=1 lua5.1 tools/smoketest.lua   # the same addon as a Retail (Midnight) client
      - name: Build LizzaricksUnitFrames-<version>.zip
        id: pkg
        run: echo "zip=$(sh tools/package.sh)" >> "$GITHUB_OUTPUT"
      # A release is only made on request: Actions -> package -> "Run workflow".
      # Pushes to main just check and build. The zip unzips straight into
      # Interface/AddOns with the right folder name.
      - name: Publish release "latest"
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.pkg.outputs.zip }}" --title "Lizzarick's Unit Frames (latest)" \
            --notes "Newest build of main ($GITHUB_SHA). For WoW: Forever and Retail (Midnight). Unzip the zip into the game's Interface/AddOns folder (Forever: World of Warcraft/_classic_beta_/Interface/AddOns, Retail: World of Warcraft/_retail_/Interface/AddOns)." \
            --target "$GITHUB_SHA" --latest
